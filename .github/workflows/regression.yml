name: Pattern Lab Regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: node geometry.test.cjs
      - run: node advanced.test.cjs
      - run: node redraw.test.cjs
      - run: node codegen.test.cjs
      - run: node cleanup.test.cjs
      - run: node stroke-boundary.test.cjs
